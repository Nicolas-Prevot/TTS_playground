[project]
name = "tts-core"
version = "0.1.0"
description = "Shared base classes for TTS Playground"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "soundfile",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_core"]