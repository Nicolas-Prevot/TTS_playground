[project]
name = "tts-adapter-higgsaudio"
version = "0.1.0"
description = "Adapter for HiggsAudio V2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "accelerate>=0.26.0",
    "boson-multimodal",
    "dacite>=1.9.2",
    "descript-audio-codec>=1.0.0",
    "descript-audiotools>=0.7.2",
    "jieba>=0.42.1",
    "langid>=1.1.6",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "omegaconf>=2.4.0.dev3",
    "pandas>=2.3.1",
    "tqdm>=4.67.1",
    "transformers>=4.45.1,<4.47.0",
    "vector-quantize-pytorch>=1.22.18",
    "tts-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_adapter_higgsaudio"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
tts-core = { path = "../../libs/tts_core", editable = true }
boson-multimodal = { git = "https://github.com/boson-ai/higgs-audio.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true