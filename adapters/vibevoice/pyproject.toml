[project]
name = "tts-adapter-vibevoice"
version = "0.1.0"
description = "Adapter for VibeVoice TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchaudio",
    "vibevoice", 
    "transformers",
    "accelerate", 
    "loguru",
    "tts-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_adapter_vibevoice"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
tts-core = { path = "../../libs/tts_core", editable = true }
vibevoice = { git = "https://github.com/vibevoice-community/VibeVoice.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true