[project]
name = "tts-adapter-kyutai"
version = "0.1.0"
description = "Adapter for Kyutai (Moshi) 1.6B TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "moshi>=0.2.6,<0.3",
    "torch>=2.2.0,<2.8",
    "torchaudio",
    "numpy",
    "loguru",
    "tts-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_adapter_kyutai"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
tts-core = { path = "../../libs/tts_core", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true