[project]
name = "tts-adapter-f5tts"
version = "0.1.0"
description = "Adapter for F5-TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch<2.9",
    "torchaudio",
    "f5-tts>=1.1.15",
    "bigvgan>=2.4.1",
    "cached_path>=1.8.0",
    "soundfile>=0.13.1",
    "loguru",
    "tts-core",
    #"hydra-core>=1.3.2",
    #"omegaconf>=2.3.0",
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_adapter_f5tts"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
tts-core = { path = "../../libs/tts_core", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true