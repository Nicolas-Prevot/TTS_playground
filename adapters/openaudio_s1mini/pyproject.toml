[project]
name = "tts-adapter-openaudio-s1mini"
version = "0.1.0"
description = "Adapter for OpenAudio S1 Mini TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch<2.9",
    "torchaudio",
    "fish-speech",
    "numpy",
    "soundfile",
    "loguru",
    "hydra-core>=1.3",
    "tts-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_adapter_openaudio_s1mini"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
tts-core = { path = "../../libs/tts_core", editable = true }
fish-speech = { git = "https://github.com/fishaudio/fish-speech.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true