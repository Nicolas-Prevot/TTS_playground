[project]
name = "tts-adapter-indextts2"
version = "0.1.0"
description = "Adapter for IndexTTS2"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "indextts",
    "numpy",
    "soundfile",
    "torch",
    "torchaudio",
    "loguru",
    "tts-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_adapter_indextts2"]

[tool.uv.sources]
indextts = { url = "https://github.com/index-tts/index-tts/archive/refs/heads/main.zip" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
tts-core = { path = "../../libs/tts_core", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true